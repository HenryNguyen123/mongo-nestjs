version: "3.8"

services:
  mongodb:
    image: mongo:8
    container_name: mongodb-learning
    restart: always

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: